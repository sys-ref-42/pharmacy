<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farmacia">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B2E22">
<title>Farmacia</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#EBEEE8; --card:#FCFCFA; --card-2:#F4F6F1;
  --ink:#131E19; --ink-2:#5B6862; --ink-3:#909C95;
  --line:#DBDFD7; --line-2:#E8EBE4;
  --green:#00934B; --green-deep:#0B2E22; --green-soft:#E2F0E6;
  --btn:#0B2E22; --btn-ink:#EAF3EC;
  --amber:#B36B00; --amber-soft:#FBF0DC;
  --red:#BE2F26; --red-soft:#FAE7E4;
  --violet:#6D4AA8; --violet-soft:#EDE7F7;
  --shadow-lg:0 20px 50px -12px rgba(11,46,34,.4);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0A1310; --card:#141F1A; --card-2:#1A2721;
    --ink:#E7EDE9; --ink-2:#94A29B; --ink-3:#6B7C74;
    --line:#233129; --line-2:#1C2922;
    --green:#3ED27F; --green-deep:#071310; --green-soft:#14291E;
    --btn:#2A6247; --btn-ink:#EFF7F1;
    --amber:#E2A33C; --amber-soft:#2A2216;
    --red:#F0736A; --red-soft:#2C1917;
    --violet:#A88BE0; --violet-soft:#221C31;
    --shadow-lg:0 20px 50px -12px rgba(0,0,0,.7);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter Tight',system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink);
  min-height:100vh; min-height:100dvh;
  max-width:520px; margin:0 auto;
  overflow-x:hidden; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
a{color:inherit}
.disp{font-family:'Bricolage Grotesque','Inter Tight',sans-serif;font-weight:800;letter-spacing:-.025em}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* header */
.hdr{
  position:sticky;top:0;z-index:40;
  background:var(--green-deep);color:#EAF3EC;
  padding:max(env(safe-area-inset-top),14px) 16px 14px;
  display:flex;align-items:center;gap:11px;
}
.hdr .brand{flex:1;min-width:0}
.hdr h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.hdr .sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(234,243,236,.5);margin-top:3px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#3ED27F;flex-shrink:0}
.dot.off{background:#E2A33C}
.hdr-btn{
  width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;flex-shrink:0;
}
.hdr-btn:active{background:rgba(255,255,255,.2)}
.hdr-btn.primary{background:#EAF3EC;color:var(--green-deep);font-weight:700;width:auto;padding:0 14px;font-size:14px;letter-spacing:-.01em}

/* mini cross logo */
.logo{display:grid;grid-template-columns:repeat(7,3px);gap:1.5px;flex-shrink:0}
.logo i{width:3px;height:3px;border-radius:.5px;background:rgba(255,255,255,.13)}
.logo i.on{background:#EAF3EC}

/* layout */
.wrap{padding:18px 16px calc(80px + env(safe-area-inset-bottom))}
.sec{margin-top:26px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px}
.sec-hd .cnt{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-3)}

/* LED cross */
.hero{text-align:center;padding:20px 0 2px}
.cross{display:grid;grid-template-columns:repeat(7,14px);gap:4px;justify-content:center;margin:0 auto 20px}
.cross i{width:14px;height:14px;border-radius:3px;background:var(--led-off)}
.cross i.on{background:var(--led);animation:led .45s backwards}
@keyframes led{from{opacity:.15;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cross i.on{animation:none}}
.cross[data-s=ok]{--led:var(--green);--led-off:var(--green-soft)}
.cross[data-s=warn]{--led:var(--amber);--led-off:var(--amber-soft)}
.cross[data-s=bad]{--led:var(--red);--led-off:var(--red-soft)}
.hero h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:25px;line-height:1.15;letter-spacing:-.03em;margin-bottom:7px}
.hero p{font-size:14px;color:var(--ink-2);line-height:1.5;max-width:290px;margin:0 auto}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:24px}
.stat{background:var(--card);padding:14px 8px;text-align:center}
.stat b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;display:block;letter-spacing:-.03em;line-height:1}
.stat span{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:5px}

/* med row */
.row{
  display:flex;align-items:center;gap:11px;
  background:var(--card);border:1px solid var(--line-2);
  border-radius:var(--r);padding:12px 13px;margin-bottom:7px;
  position:relative;overflow:hidden;
}
.row.dim{opacity:.5}
.row .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.row .body{flex:1;min-width:0;padding-left:4px}
.row .nm{font-weight:600;font-size:14.5px;letter-spacing:-.01em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--card-2);color:var(--ink-2);white-space:nowrap;line-height:1.4}
.tag.exp-bad{background:var(--red-soft);color:var(--red);font-weight:700}
.tag.exp-warn{background:var(--amber-soft);color:var(--amber);font-weight:700}
.tag.exp-ok{background:transparent;color:var(--ink-3);padding-left:0}
.tag.rx{background:var(--violet-soft);color:var(--violet);font-weight:700}
.tag.taken{background:var(--green-soft);color:var(--green);font-weight:700}
.tag.out{background:var(--red-soft);color:var(--red);font-weight:700}

/* stepper */
.step{display:flex;align-items:center;gap:1px;background:var(--card-2);border-radius:9px;padding:2px;flex-shrink:0}
.step button{width:28px;height:28px;border-radius:7px;font-size:16px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;line-height:1}
.step button:active{background:var(--card)}
.step b{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;min-width:20px;text-align:center}

/* search + filters */
.search{position:relative;margin-bottom:10px}
.search input{
  width:100%;padding:11px 13px 11px 36px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);font-size:15px;letter-spacing:-.01em;
}
.search input::placeholder{color:var(--ink-3)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.45;pointer-events:none}
.seg{display:flex;background:var(--card-2);border-radius:11px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:6px 11px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap;
  color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;flex-shrink:0;letter-spacing:-.01em;
}
.chip .n{font-family:'Space Mono',monospace;font-size:10px;opacity:.6}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* group header */
.grp{display:flex;align-items:center;gap:9px;margin:20px 0 9px}
.grp .lbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.grp .ln{flex:1;height:1px;background:var(--line)}
.grp .n{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-3)}

/* alerts */
.alert{border-radius:var(--r);padding:13px 14px;margin-bottom:8px;border:1px solid}
.alert.bad{background:var(--red-soft);border-color:rgba(190,47,38,.22)}
.alert.warn{background:var(--amber-soft);border-color:rgba(179,107,0,.22)}
.alert .t{font-weight:700;font-size:13px;margin-bottom:8px;letter-spacing:-.01em}
.alert.bad .t{color:var(--red)} .alert.warn .t{color:var(--amber)}
.alert .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:13.5px;border-top:1px solid rgba(128,128,128,.14)}
.alert .li:first-of-type{border-top:none}
.alert .li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert .li .d{font-family:'Space Mono',monospace;font-size:10px;flex-shrink:0;font-weight:700}
.alert.bad .li .d{color:var(--red)} .alert.warn .li .d{color:var(--amber)}

/* symptoms */
.sym-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sym{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 12px;text-align:left}
.sym .e{font-size:22px;line-height:1;display:block;margin-bottom:9px}
.sym .l{font-weight:600;font-size:13.5px;letter-spacing:-.01em;line-height:1.25;display:block}
.sym .a{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--green);font-weight:700;display:block}
.sym .a.none{color:var(--ink-3);font-weight:400}

/* contacts */
.con{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:15px;margin-bottom:8px;position:relative;overflow:hidden}
.con .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.con .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.con .lb{font-weight:700;font-size:13.5px;letter-spacing:-.01em}
.con .nm{font-size:15px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.con .ad{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.con .ph{display:inline-flex;align-items:center;gap:7px;margin-top:11px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;text-decoration:none}
.con .nt{font-size:12px;color:var(--ink-3);margin-top:8px}
.con .empty{font-size:13.5px;color:var(--ink-3);margin-top:5px}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sos a{background:var(--red-soft);border:1px solid rgba(190,47,38,.22);border-radius:var(--r);padding:14px;text-align:center;text-decoration:none;display:block}
.sos b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:var(--red);display:block;line-height:1;letter-spacing:-.02em}
.sos span{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:block;margin-top:6px}

/* forms */
.fld{margin-bottom:16px}
.fld > label{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:7px;font-weight:700}
.fld input,.fld textarea{
  width:100%;padding:11px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);font-size:15.5px;letter-spacing:-.01em;
}
.fld textarea{resize:vertical;min-height:66px;line-height:1.45;font-size:14.5px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--green)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{
  padding:8px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em;
}
.opt.on{border-color:var(--sel);color:var(--sel);background:var(--card-2)}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:left}
.btn{width:100%;padding:14px;border-radius:13px;font-weight:700;font-size:15.5px;background:var(--btn);color:var(--btn-ink);letter-spacing:-.01em}
.btn:disabled{background:var(--line);color:var(--ink-3)}
.btn.ghost{background:var(--card-2);color:var(--ink-2);font-weight:600}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn{flex:1}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(7,19,16,.55);z-index:90;opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.veil.in{opacity:1}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);
  width:100%;max-width:520px;z-index:91;
  background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
.sheet.in{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet,.veil{transition:none}}
.sheet .grab{width:34px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 0}
.sheet .pad{padding:16px 20px 0}
.sheet h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.025em;line-height:1.2}
.sheet .close{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-2)}

.dt-hd{display:flex;gap:13px;align-items:flex-start;margin-bottom:16px;padding-right:34px}
.dt-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;background:var(--card-2)}
.dt-rows{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.dt-r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line-2);font-size:14px}
.dt-r:first-child{border-top:none}
.dt-r .k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);flex-shrink:0}
.dt-r .v{font-weight:600;text-align:right;letter-spacing:-.01em}
.note{background:var(--card-2);border-radius:var(--r);padding:13px 14px;font-size:14px;line-height:1.5;color:var(--ink-2);margin-bottom:14px}
.warn-box{background:var(--violet-soft);border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.45;color:var(--violet);margin-bottom:14px;font-weight:500}
.hint{font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:14px}

/* nav */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;z-index:50;
  background:var(--card);border-top:1px solid var(--line-2);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;border-radius:10px;position:relative}
.nav .i{font-size:16px;line-height:1;opacity:.4;position:relative}
.nav .l{font-size:9.5px;font-weight:600;color:var(--ink-3)}
.nav button.on .i{opacity:1}
.nav button.on .l{color:var(--ink)}
.badge{position:absolute;top:-5px;left:11px;background:var(--red);color:#fff;font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* empty */
.empty-st{text-align:center;padding:42px 24px}
.empty-st .e{font-size:32px;display:block;margin-bottom:12px;opacity:.5}
.empty-st b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;display:block;margin-bottom:5px;letter-spacing:-.02em}
.empty-st p{font-size:13.5px;color:var(--ink-2);line-height:1.5;max-width:260px;margin:0 auto}

/* boot */
.boot{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.boot .cross i.on{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.boot p{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
</style>
</head>

/* ═══ HELPERS ═══ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function arr(o){return o?Object.keys(o).map(function(k){return o[k]}):[]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function expiry(s){
  if(!s||!/^\d{4}-\d{2}$/.test(s))return{s:"none",label:"No date set",short:"No date",days:null};
  var p=s.split("-"), end=new Date(+p[0],+p[1],0,23,59,59);
  var days=Math.ceil((end-new Date())/864e5);
  var pretty=MN[+p[1]-1]+" "+p[0];
  if(days<0)return{s:"bad",label:"Expired "+pretty,short:"EXP "+pretty,days:days};
  if(days<=90)return{s:"warn",label:days+" days left \u00B7 "+pretty,short:days+"D LEFT",days:days};
  return{s:"ok",label:"Good until "+pretty,short:pretty,days:days};
}
function isRx(m){return /\brx\b|prescription/i.test(m.notes||"")}
function usesOf(m){
  return String(m.uses||"").split(",").map(function(x){return x.trim()}).filter(Boolean);
}
function symById(id){var r=null;SYMS.forEach(function(s){if(s.id===id)r=s});return r}
function norm(s){
  return String(s==null?"":s).toLowerCase()
    .normalize?String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()
    :String(s==null?"":s).toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
/* free-text -> symptoms, tolerant of EN / IT / FR and partial words.
   Ranks on: match tier, then how much of the phrase matched, then how tight the fit is. */
function resolveSymptoms(query){
  var nq=norm(query);
  if(nq.length<2)return [];
  var words=nq.split(" ").filter(function(w){return w.length>=3});
  var hits=[];
  SYMS.forEach(function(s){
    var pool=[norm(s.l)].concat((s.a||[]).map(norm));
    var tier=0, fit=0, hitWords={};
    pool.forEach(function(al){
      if(!al)return;
      var t=0;
      if(al===nq)t=5;
      else if(al.indexOf(nq)===0||nq.indexOf(al)===0)t=4;
      else if(al.indexOf(nq)>=0||nq.indexOf(al)>=0)t=3;
      if(t){
        var f=Math.min(al.length,nq.length)/Math.max(al.length,nq.length);
        if(t>tier){tier=t;fit=f}
        else if(t===tier&&f>fit)fit=f;
      }
      var alw=al.split(" ");
      for(var j=0;j<words.length;j++){
        var w=words[j];
        for(var i=0;i<alw.length;i++){
          if(alw[i]===w){hitWords[w]=Math.max(hitWords[w]||0,w.length*2);if(tier<3)tier=3;break}
          if(alw[i].indexOf(w)===0||w.indexOf(alw[i])===0){hitWords[w]=Math.max(hitWords[w]||0,w.length);if(tier<2)tier=2;break}
        }
      }
    });
    if(!tier)return;
    var cover=0;
    Object.keys(hitWords).forEach(function(k){cover+=hitWords[k]});
    hits.push({s:s,tier:tier,cover:cover,fit:fit});
  });
  return hits.sort(function(a,b){
    return b.tier-a.tier || b.cover-a.cover || b.fit-a.fit;
  }).map(function(x){return x.s});
}
/* same matching, but across what you've run out of */
function symMatchesOut(sym){return rank(outStock(),sym,2)}
/* medicines whose own name / note text mentions the query */
function medTextMatches(query){
  var nq=norm(query);
  if(nq.length<3)return [];
  return inStock().filter(function(m){
    return norm(m.name+" "+(m.notes||"")).indexOf(nq)>=0;
  }).sort(byName);
}
function ago(t){
  if(!t)return null;
  var mins=Math.floor((Date.now()-t)/6e4);
  if(mins<1)return"just now";
  if(mins<60)return mins+"m ago";
  var h=Math.floor(mins/60);
  if(h<24)return h+"h ago";
  var d=Math.floor(h/24);
  return d===1?"yesterday":d+"d ago";
}
function catOf(m){return CATS[m.cat]||CATS.other}
function unitLabel(m){
  var u=m.unit||"box", n=m.qty||0;
  if(n===1)return u;
  return u==="box"?"boxes":u+"s";
}
function inStock(){return arr(meds).filter(function(m){return(m.qty||0)>0})}
function outStock(){return arr(meds).filter(function(m){return(m.qty||0)===0})}
function expired(){return inStock().filter(function(m){return expiry(m.exp).s==="bad"})}
function expiringSoon(){return inStock().filter(function(m){return expiry(m.exp).s==="warn"})}
function health(){return expired().length?"bad":(expiringSoon().length?"warn":"ok")}
function byExpiry(a,b){return expiry(a.exp).days-expiry(b.exp).days}
function byName(a,b){return(a.name||"").localeCompare(b.name||"")}

function crossHTML(state){

  for(var r=0;r<7;r++)for(var c=0;c<7;c++){
    var on=(c>=2&&c<=4)||(r>=2&&r<=4);
    var d=Math.abs(r-3)+Math.abs(c-3);
    h+='<i'+(on?' class="on" style="animation-delay:'+(d*55)+'ms"':'')+'></i>';
  }
  return h+'</div>';
}
function logoHTML(){

  for(var r=0;r<7;r++)for(var c=0;c<7;c++){

}

      h+='<div class="grp"><span class="lbl">'+esc(p)+'</span><span class="ln"></span><span class="n">'+places[p].length+'</span></div>';

/* keywords match at word starts only, so "burn" never matches "heartburn" */
function kwHit(m,keys){
  var hay=" "+norm((m.name||"")+" "+(m.notes||""))+" ";
  for(var i=0;i<keys.length;i++){if(hay.indexOf(" "+norm(keys[i]))>=0)return true}
  return false;
}
function scoreFor(m,sym){
  if(usesOf(m).indexOf(sym.id)>=0)return 3;          /* tagged for this */
  if(kwHit(m,sym.k))return 2;                        /* named in the medicine */
  if(sym.c.indexOf(m.cat)>=0)return 1;               /* same shelf */
  return 0;
}
function rank(pool,sym,minScore){
  var scored=pool.map(function(m){return{m:m,s:scoreFor(m,sym)}}).filter(function(x){return x.s>=minScore});
  var strong=scored.filter(function(x){return x.s>1});
  /* only widen to the whole shelf when the precise matches are thin */
  var use=strong.length>=3?strong:scored;
  return use.sort(function(a,b){return b.s-a.s||byName(a.m,b.m)}).map(function(x){return x.m});
}
function symMatches(sym){return rank(inStock(),sym,1)}

    if(!sym){symSel=null;return screenSymptoms()}
    var found=symMatches(sym);
    h+='<button class="chip" data-act="symback" style="margin-bottom:18px">\u2190 All symptoms</button>';
    h+='<div style="display:flex;gap:14px;align-items:center;margin-bottom:20px">';
    h+='<div style="font-size:32px;line-height:1">'+sym.e+'</div>';
    h+='<div><h2 class="disp" style="font-size:23px;line-height:1.15">'+sym.l+'</h2>';
    h+='<div class="eyebrow" style="margin-top:5px">'+(found.length?found.length+" in your cabinet":"nothing in your cabinet")+'</div></div></div>';
    var goneD=symMatchesOut(sym);
    if(found.length){
      h+=found.map(rowHTML).join("");
    }else{
      h+='<div class="empty-st"><span class="e">\uD83C\uDFE5</span><b>Nothing in stock</b><p>'+(goneD.length?"You track "+(goneD.length===1?"one thing":goneD.length+" things")+" for this, but you\u2019re out of "+(goneD.length===1?"it":"them")+".":"You don\u2019t have anything for "+sym.l.toLowerCase()+" \u2014 worth picking something up.")+'</p></div>';
    }
    if(goneD.length){
      h+='<div class="grp"><span class="lbl">Out of stock</span><span class="ln"></span><span class="n">'+goneD.length+'</span></div>';
      h+=goneD.map(rowHTML).join("");
    }
    if(found.length)h+='<p class="hint">These are things you own that are commonly used for '+sym.l.toLowerCase()+'. It\u2019s a list of what\u2019s in the house, not a recommendation \u2014 read the leaflet for the dose, and ask a pharmacist if you\u2019re unsure or already taking something else.</p>';
    return h+'</div>';
  }
  h+='<div class="search"><span class="ic">\uD83E\uDE7A</span><input id="sq" type="search" placeholder="Type what\u2019s wrong \u2014 any language" value="'+esc(symQ)+'" autocomplete="off" autocorrect="off" spellcheck="false"></div>';
  h+='<div id="symres">'+symResults()+'</div>';
  return h+'</div>';
}

function symResults(){
  if(!symQ.trim()){
    var h='<p style="font-size:13.5px;color:var(--ink-2);margin:2px 0 14px;line-height:1.5">Type a symptom above, or pick one below. Try <em>mal di testa</em>, <em>puntura</em>, <em>br\u00fblure</em>, <em>heartburn</em>.</p>';
    h+='<div class="sym-grid">';
    SYMS.forEach(function(s){
      var n=symMatches(s).length, g=n?0:symMatchesOut(s).length;
      h+='<button class="sym" data-act="sym" data-v="'+s.id+'"><span class="e">'+s.e+'</span><span class="l">'+s.l+'</span>';
      h+='<span class="a'+(n?"":" none")+'">'+(n?n+" in stock":(g?"out of stock":"nothing"))+'</span></button>';
    });
    return h+'</div>';
  }

  var found=resolveSymptoms(symQ);
  var h="";

  if(found.length){
    var top=found[0], meds1=symMatches(top);
    h+='<div class="eyebrow" style="margin-bottom:9px">Reading that as</div>';
    h+='<div class="chips" style="margin-bottom:16px">';
    found.slice(0,4).forEach(function(s,i){
      h+='<button class="chip'+(i===0?" on":"")+'" data-act="sym" data-v="'+s.id+'">'+s.e+' '+s.l+'</button>';
    });
    h+='</div>';
    h+='<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">';
    h+='<div style="font-size:28px;line-height:1">'+top.e+'</div>';
    h+='<div><h2 class="disp" style="font-size:20px;line-height:1.15">'+top.l+'</h2>';
    h+='<div class="eyebrow" style="margin-top:4px">'+(meds1.length?meds1.length+" in your cabinet":"nothing in your cabinet")+'</div></div></div>';
    var gone=symMatchesOut(top);
    if(meds1.length){
      h+=meds1.map(rowHTML).join("");
    }else{
      h+='<div class="empty-st"><span class="e">\uD83C\uDFE5</span><b>Nothing in stock</b><p>'+(gone.length?"You track "+(gone.length===1?"one thing":gone.length+" things")+" for this, but you\u2019re out of "+(gone.length===1?"it":"them")+".":"You don\u2019t have anything for "+top.l.toLowerCase()+" \u2014 worth picking something up.")+'</p></div>';
    }
    if(gone.length){
      h+='<div class="grp"><span class="lbl">Out of stock</span><span class="ln"></span><span class="n">'+gone.length+'</span></div>';
      h+=gone.map(rowHTML).join("");
    }
    if(meds1.length)h+='<p class="hint">Things you own that are commonly used for '+top.l.toLowerCase()+'. It\u2019s what\u2019s in the house, not a recommendation \u2014 read the leaflet for the dose, and ask a pharmacist if you\u2019re unsure or already taking something else.</p>';
    if(found.length>1)h+='<p class="hint">Meant something else? Tap another reading above.</p>';
    return h;
  }

  var direct=medTextMatches(symQ);
  if(direct.length){
    h+='<div class="eyebrow" style="margin-bottom:9px">No symptom matched \u2014 medicines mentioning \u201C'+esc(symQ)+'\u201D</div>';
    return h+direct.map(rowHTML).join("");
  }
  return '<div class="empty-st"><span class="e">\uD83E\uDD14</span><b>Not sure what that is</b><p>Try a simpler word \u2014 <em>stomach</em>, <em>pancia</em>, <em>t\u00eate</em>, <em>bite</em> \u2014 or pick from the list by clearing the search.</p></div>';
}

function screenBuy(){
  var out=outStock().sort(byName), exp=expired().sort(byExpiry);
  var h='<div class="wrap">';
  if(!out.length&&!exp.length){
    return h+'<div class="empty-st"><span class="e">\u2705</span><b>Nothing to buy</b><p>Everything you track is in stock and in date. When something runs out, it shows up here.</p></div></div>';
  }
  if(exp.length){
    h+='<div class="sec-hd"><span class="eyebrow">Expired \u2014 replace</span><span class="cnt">'+exp.length+'</span></div>';
    h+=exp.map(rowHTML).join("");
  }
  if(out.length){
    h+='<div'+(exp.length?' class="sec"':'')+'><div class="sec-hd"><span class="eyebrow">Out of stock</span><span class="cnt">'+out.length+'</span></div>';
    h+='<p style="font-size:13px;color:var(--ink-2);margin-bottom:14px;line-height:1.5">Tap + once you\u2019ve bought something and it moves back into the cabinet.</p>';

/* ═══ SHEETS ═══ */
function openSheet(html){
  var l=document.getElementById("layer");
  l.innerHTML='<div class="veil" data-act="closesheet"></div><div class="sheet"><div class="grab"></div><button class="close" data-act="closesheet" aria-label="Close">\u2715</button><div class="pad">'+html+'</div></div>';
  requestAnimationFrame(function(){
    var v=l.querySelector(".veil"), s=l.querySelector(".sheet");
    if(v)v.classList.add("in");
    if(s)s.classList.add("in");
  });
  document.body.style.overflow="hidden";
}
function closeSheet(){
  var l=document.getElementById("layer");
  var v=l.querySelector(".veil"), s=l.querySelector(".sheet");
  if(v)v.classList.remove("in");
  if(s)s.classList.remove("in");
  document.body.style.overflow="";
  sheet=null; form=null; formEditId=null;
  setTimeout(function(){if(!sheet)l.innerHTML=""},320);
}

function sheetDetail(id){
  var m=meds[id]; if(!m){closeSheet();return}
  var wasOpen=sheet&&sheet.type==="detail"&&sheet.id===id;
  sheet={type:"detail",id:id};
  var cat=catOf(m), ex=expiry(m.exp), taken=ago(m.lastTaken);
  var col=ex.s==="bad"?"var(--red)":ex.s==="warn"?"var(--amber)":"var(--ink)";
  var h='<div class="dt-hd"><div class="dt-ic">'+cat.e+'</div>';
  h+='<div style="flex:1;min-width:0"><h3>'+esc(m.name)+'</h3>';
  h+='<div class="eyebrow" style="margin-top:5px">'+cat.l+'</div></div></div>';
  if(isRx(m))h+='<div class="warn-box">Prescription medicine. Only take this if a doctor prescribed it to you, for this problem \u2014 and finish the course they gave you.</div>';
  h+='<div class="dt-rows">';
  h+='<div class="dt-r"><span class="k">Quantity</span><span class="v">'+(m.qty||0)+' '+unitLabel(m)+'</span></div>';
  h+='<div class="dt-r"><span class="k">Expiry</span><span class="v" style="color:'+col+'">'+ex.label+'</span></div>';
  h+='<div class="dt-r"><span class="k">Where</span><span class="v">'+(m.loc?esc(m.loc):'<span style="color:var(--ink-3);font-weight:400">Not placed</span>')+'</span></div>';
  if(taken)h+='<div class="dt-r"><span class="k">Last dose</span><span class="v">'+taken+'</span></div>';
  h+='</div>';
  var us=usesOf(m);
  if(us.length){
    h+='<div class="eyebrow" style="margin-bottom:8px">Used for</div><div class="chips" style="margin-bottom:16px">';
    us.forEach(function(u){var sy=symById(u);if(sy)h+='<button class="chip" data-act="symjump" data-v="'+u+'">'+sy.e+' '+sy.l+'</button>'});
    h+='</div>';
  }
  if(m.notes)h+='<div class="note">'+esc(m.notes)+'</div>';
  h+='<button class="btn" data-act="took" data-id="'+id+'">Log a dose</button>';
  h+='<div class="btn-row"><button class="btn ghost" data-act="edit" data-id="'+id+'">Edit</button>';
  h+='<button class="btn danger" data-act="askdel" data-id="'+id+'">Delete</button></div>';
  h+='<p class="hint">Logging a dose records the time only, so you both know whether it\u2019s already been taken. It doesn\u2019t change the quantity.</p>';
  if(wasOpen){
    var pad=document.querySelector(".sheet .pad");
    if(pad){pad.innerHTML=h;return}
  }
  openSheet(h);
}

function bindForm(){
  var n=document.getElementById("f-name");
  if(n)n.oninput=function(){

    if(b)b.disabled=!this.value.trim();
  };
  var e=document.getElementById("f-exp"); if(e)e.onchange=function(){form.exp=this.value};
  var l=document.getElementById("f-loc"); if(l)l.oninput=function(){form.loc=this.value};
  var t=document.getElementById("f-notes"); if(t)t.oninput=function(){form.notes=this.value};
}
function saveForm(){
  if(!form||!form.name.trim())return;
  var p={name:form.name.trim(),cat:form.cat,exp:form.exp||"",qty:form.qty||0,unit:form.unit,loc:(form.loc||"").trim(),notes:(form.notes||"").trim(),uses:form.uses.join(",")};
  if(formEditId){
    p.id=formEditId;
    if(meds[formEditId]&&meds[formEditId].lastTaken)p.lastTaken=meds[formEditId].lastTaken;
    medsRef.child(formEditId).set(p);
  }else{
    var id=uid(); p.id=id; medsRef.child(id).set(p);
  }
  closeSheet();
}

function exportData(){
  var blob=new Blob([JSON.stringify({exported:new Date().toISOString(),meds:meds,contacts:contacts},null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="farmacia-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ═══ EVENTS ═══ */
document.addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!t)return;
  var a=t.getAttribute("data-act"), id=t.getAttribute("data-id"), v=t.getAttribute("data-v");

  if(a==="inc"||a==="dec"){
    ev.stopPropagation();
    var m=meds[id]; if(!m)return;
    var nq=Math.max(0,(m.qty||0)+(a==="inc"?1:-1));
    m.qty=nq;
    var b=t.parentNode.querySelector("b"); if(b)b.textContent=nq;
    var row=t.closest(".row"); if(row)row.classList.toggle("dim",nq===0);
    medsRef.child(id).update({qty:nq});
    return;
  }

  if(a==="tab"){tab=v;symSel=null;symQ="";q="";catF="all";render();return}
  if(a==="add"){sheetForm(null);return}
  if(a==="menu"){sheetMenu();return}
  if(a==="export"){exportData();return}
  if(a==="closesheet"){closeSheet();return}
  if(a==="open"){sheetDetail(id);return}
  if(a==="edit"){sheetForm(id);return}
  if(a==="askdel"){sheetDelete(id);return}
  if(a==="dodel"){medsRef.child(id).remove();closeSheet();return}
  if(a==="took"){
    if(meds[id])meds[id].lastTaken=Date.now();
    medsRef.child(id).update({lastTaken:Date.now()});
    sheetDetail(id);
    return;
  }
  if(a==="grp"){groupBy=v;render();return}
  if(a==="cat"){catF=v;render();return}
  if(a==="stockf"){stockF=stockF==="in"?"all":"in";render();return}
  if(a==="sort"){sortBy=sortBy==="name"?"exp":"name";render();return}
  if(a==="sym"){symSel=v;symQ="";render();return}
  if(a==="symback"){symSel=null;render();return}
  if(a==="symjump"){closeSheet();tab="symptoms";symSel=v;symQ="";render();return}
  if(a==="econ"){sheetContact(id);return}
  if(a==="csave"){saveContact(id);return}
  if(a==="fcat"){form.cat=v;renderForm();return}
  if(a==="funit"){form.unit=v;renderForm();return}
  if(a==="floc"){form.loc=(form.loc===v?"":v);renderForm();return}
  if(a==="fuse"){
    var ix=form.uses.indexOf(v);
    if(ix>=0)form.uses.splice(ix,1); else form.uses.push(v);
    renderForm(); return;
  }
  if(a==="finc"){form.qty=(form.qty||0)+1;renderForm();return}
  if(a==="fdec"){form.qty=Math.max(0,(form.qty||0)-1);renderForm();return}
  if(a==="fsave"){saveForm();return}
});

/* live search without losing focus */
document.addEventListener("input",function(ev){
  if(!ev.target)return;
  if(ev.target.id==="q"){
    q=ev.target.value;
    var listEl=document.getElementById("list");
    if(listEl)listEl.innerHTML=cabinetList();
    return;
  }
  if(ev.target.id==="sq"){
    symQ=ev.target.value;
    var res=document.getElementById("symres");
    if(res)res.innerHTML=symResults();
  }
});

/* ═══ SYNC ═══ */
medsRef.on("value",function(s){
  meds=s.val()||{};
  Object.keys(meds).forEach(function(k){if(!meds[k].id)meds[k].id=k});
  ready=true;
  render();
  if(sheet&&sheet.type==="detail")sheetDetail(sheet.id);
},function(){ready=true;online=false;render()});

contactsRef.on("value",function(s){
  contacts=s.val()||{};
  if(ready)render();
});

db.ref(".info/connected").on("value",function(s){
  online=!!s.val();
  var d=document.querySelector(".hdr .dot");
  if(d)d.className="dot"+(online?"":" off");
});
